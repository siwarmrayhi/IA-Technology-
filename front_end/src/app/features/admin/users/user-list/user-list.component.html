<div class="page-container">
  <div class="page-header">
    <div>
      <h1><mat-icon>manage_accounts</mat-icon> Gestion des Comptes</h1>
    </div>
    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>person_add</mat-icon> Créer un compte
    </button>
  </div>

  <mat-card>
    <table mat-table [dataSource]="dataSource" class="full-width">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Utilisateur</th>
        <td mat-cell *matCellDef="let u">
          <div class="user-cell">
            <mat-icon class="avatar-icon">account_circle</mat-icon>
            {{ u.username }}
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Rôles</th>
        <td mat-cell *matCellDef="let u">
          <mat-chip-set>
            <mat-chip *ngFor="let r of u.roles"
              [color]="r.name === 'ADMIN' ? 'warn' : r.name === 'MODERATOR' ? 'accent' : 'primary'"
              highlighted>
              {{ r.name }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="created">
        <th mat-header-cell *matHeaderCellDef>Créé le</th>
        <td mat-cell *matCellDef="let u">{{ u.created_at | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button color="primary" (click)="openForm(u)" matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(u)" matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25]" showFirstLastButtons></mat-paginator>
  </mat-card>
</div>
