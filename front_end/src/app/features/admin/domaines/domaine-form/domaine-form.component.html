<h2 mat-dialog-title>
  <mat-icon>{{ isEdit ? 'edit' : 'add_circle' }}</mat-icon>
  {{ isEdit ? 'Modifier le domaine' : 'Ajouter un domaine' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" style="padding: 8px 0; display: flex; flex-direction: column; gap: 16px;">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom du domaine *</mat-label>
      <input matInput formControlName="nom" placeholder="Ex: NLP, Vision par ordinateur..." />
      <mat-error *ngIf="form.get('nom')?.hasError('required')">Champ obligatoire</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"
        placeholder="Description du domaine de recherche..."></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-raised-button color="primary" (click)="onSubmit()"
    [disabled]="form.invalid || loading">
    <mat-spinner diameter="18" *ngIf="loading"></mat-spinner>
    <span *ngIf="!loading">{{ isEdit ? 'Enregistrer' : 'Ajouter' }}</span>
  </button>
</mat-dialog-actions>
