<div class="page-container">
  <div class="page-header">
    <div>
      <h1><mat-icon>category</mat-icon> Gestion des Domaines</h1>
      <p>{{ dataSource.data.length }} domaine(s) enregistré(s)</p>
    </div>
    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon> Ajouter un domaine
    </button>
  </div>

  <mat-card class="search-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Rechercher un domaine...</mat-label>
      <input matInput (keyup)="applyFilter($event)" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card>

  <mat-card>
    <div *ngIf="loading" class="loading-center">
      <mat-spinner></mat-spinner>
    </div>

    <table mat-table [dataSource]="dataSource" class="full-width" *ngIf="!loading">

      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef>Nom du domaine</th>
        <td mat-cell *matCellDef="let d">
          <strong>{{ d.nom }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let d">
          {{ d.description || '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let d">
          <button mat-icon-button color="primary" (click)="openForm(d)" matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(d)" matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data-cell" colspan="3">Aucun domaine trouvé</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </mat-card>
</div>
