<div class="page-container">
  <div class="page-header">
    <div>
      <h1><mat-icon>groups</mat-icon> Gestion des Chercheurs</h1>
      <p>{{ dataSource.data.length }} chercheur(s) enregistré(s)</p>
    </div>
    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon> Ajouter un chercheur
    </button>
  </div>

  <!-- Barre de recherche -->
  <mat-card class="search-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Rechercher par nom, email, affiliation...</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Filtrer les chercheurs" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card>

  <!-- Table -->
  <mat-card>
    <div *ngIf="loading" class="loading-center"><mat-spinner></mat-spinner></div>

    <table mat-table [dataSource]="dataSource" matSort class="full-width" *ngIf="!loading">

      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let c">{{ c.nom }}</td>
      </ng-container>

      <ng-container matColumnDef="prenom">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Prénom</th>
        <td mat-cell *matCellDef="let c">{{ c.prenom }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let c">
          <a [href]="'mailto:' + c.email">{{ c.email }}</a>
        </td>
      </ng-container>

      <ng-container matColumnDef="affiliation">
        <th mat-header-cell *matHeaderCellDef>Affiliation</th>
        <td mat-cell *matCellDef="let c">{{ c.affiliation }}</td>
      </ng-container>

      <ng-container matColumnDef="domaine">
        <th mat-header-cell *matHeaderCellDef>Domaine</th>
        <td mat-cell *matCellDef="let c">
          <mat-chip *ngIf="c.domaine" color="accent">{{ c.domaine.nom }}</mat-chip>
          <span *ngIf="!c.domaine" class="no-data">—</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let c">
          <button mat-icon-button color="primary" (click)="openForm(c)" matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(c)" matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
          Aucun chercheur trouvé
        </td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </mat-card>
</div>
